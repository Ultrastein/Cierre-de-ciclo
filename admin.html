<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Panel del profe · Álbum de Logros 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a2e;--card:#16213e;--blue:#0f3460;--red:#e94560;--gold:#ffd700;--txt:#f4f4f8;--muted:#a9b0c7;--ok:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:17px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:26px;margin-bottom:14px;color:var(--gold)}
input,select{padding:11px 14px;border-radius:12px;border:2px solid var(--blue);background:#0d1630;color:var(--txt);font:inherit}
.btn{padding:11px 18px;border-radius:12px;border:none;font:inherit;font-weight:700;cursor:pointer;background:var(--red);color:#fff}
.btn.g{background:transparent;border:2px solid var(--blue);color:var(--txt)}
.btn.y{background:var(--gold);color:#1a1a2e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.msg{color:#ffb3c0;margin:8px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--blue)}
th{color:var(--muted);font-size:14px}
td .btn{padding:6px 12px;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:50;padding:14px;flex-direction:column;gap:10px}
.modal.show{display:flex}
.modal iframe{flex:1;border:0;border-radius:14px;background:#fff;width:100%}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:2px solid var(--blue);background:#0d1630;display:block}
img.thumb{cursor:zoom-in;transition:transform .12s}
img.thumb:hover,img.thumb:focus{transform:scale(1.08);border-color:var(--gold);outline:none}
td.tf{width:74px;padding-right:0}
.muted{color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:30px;color:var(--gold)}
.sec{margin:26px 0 10px;font-size:20px;color:var(--gold)}
.hint2{color:var(--muted);font-size:15px;margin:-4px 0 12px}
.tbar{height:12px;border-radius:8px;background:rgba(128,128,128,.25);overflow:hidden;min-width:80px}
.tbar div{height:100%;border-radius:8px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.box{background:var(--card);border:2px solid var(--blue);border-radius:14px;padding:14px 16px}
.box h4{margin-bottom:8px}
.box ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.box li{font-size:15px;line-height:1.35}
.tag2{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;font-weight:700;color:#1a1a2e}
.t-ref{background:#ff9f9f}.t-ok{background:#7be0b0}.t-poc{background:#ffe08a}
.who{color:var(--muted);font-size:13px}
@media print{body{background:#fff;color:#000}#vistas,#stGrados,#login,#msg{display:none!important}.kpi,.box,table{background:#fff;border-color:#999}.kpi b,.sec{color:#000}.muted,.who,th{color:#444}}
#zoom{z-index:60;background:rgba(0,0,0,.92)}
#zbox{flex:1;overflow:auto;display:flex;border-radius:14px;cursor:zoom-out}
#zimg{margin:auto;display:block;border-radius:14px;max-width:none;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <h1>📬 Panel del profe</h1>
  <div id="login" class="row">
    <input type="password" id="clave" placeholder="Tu clave de profe" autocomplete="current-password">
    <button class="btn y" onclick="cargar()">Entrar</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="panel" style="display:none">
    <div class="row" id="vistas">
      <button class="btn y" id="vEnt" onclick="vista('ent')">📋 Entregas</button>
      <button class="btn g" id="vSt" onclick="vista('st')">📊 Estadísticas del año</button>
      <button class="btn g" id="vNj" onclick="vista('nj')">🥷 Desafío Ninja Digital</button>
    </div>
    <div id="ent">
    <div class="row">
      <select id="fGrado" onchange="pintar()"><option value="">Todos los grados</option><option>5</option><option>6</option><option>7</option></select>
      <input id="fBuscar" placeholder="Buscar alumno…" oninput="pintar()">
      <label><input type="checkbox" id="fUlt" checked onchange="pintar()"> Solo la última entrega de cada alumno</label>
      <span style="flex:1"></span>
      <button class="btn g" onclick="cargar()">🔄 Actualizar</button>
      <button class="btn g" onclick="bajar()">💾 Bajar todo (JSON)</button>
    </div>
    <div id="count" style="color:var(--muted);margin-bottom:8px"></div>
    <table><thead><tr><th></th><th>Alumno</th><th>Grado</th><th>Puesto</th><th>Enviado</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div id="nj" style="display:none">
      <div class="row" id="njGrados"></div>
      <div id="njBody"></div>
    </div>
    <div id="st" style="display:none">
      <div class="row" id="stGrados"></div>
      <div id="stBody"></div>
    </div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="row" style="margin:0"><button class="btn g" onclick="cerrar()">✖ Cerrar</button><button class="btn y" onclick="imprimir()">🖨️ Imprimir / PDF</button></div>
  <iframe id="frame" sandbox="allow-modals allow-same-origin"></iframe>
</div>
<div class="modal" id="zoom">
  <div class="row" style="margin:0">
    <button class="btn g" onclick="cerrarZoom()">✖ Cerrar</button>
    <button class="btn g" onclick="zoomPaso(-0.5)" aria-label="Alejar">➖</button>
    <button class="btn g" onclick="zoomPaso(0.5)" aria-label="Acercar">➕</button>
    <span id="zname" style="color:var(--muted)"></span>
  </div>
  <div id="zbox"><img id="zimg" alt=""></div>
</div>
<script src="config.js"></script>
<script src="catalogo.js"></script>
<script src="ninja-preguntas.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let clave='', datos=[];
async function rpc(fn,args){
  const C=CV_CONFIG;
  const r=await fetch(C.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:C.key,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok) throw new Error(r.status===400?'Clave incorrecta':'Error '+r.status);
  return r.json();
}
async function cargar(){
  $('msg').textContent='';
  if(!clave) clave=$('clave').value;
  try{
    datos=await rpc('admin_listar',{p_clave:clave});
    $('login').style.display='none'; $('panel').style.display='block'; pintar();
  }catch(e){ clave=''; $('msg').textContent='⚠️ '+e.message; }
}
$('clave').addEventListener('keydown',e=>{if(e.key==='Enter')cargar()});
function pintar(){
  const g=$('fGrado').value, q=$('fBuscar').value.toLowerCase(), ult=$('fUlt').checked, vistos=new Set();
  let l=datos.filter(d=>(!g||String(d.grado)===g)&&(d.nombre+' '+d.apellido).toLowerCase().includes(q));
  if(ult) l=l.filter(d=>{const k=d.grado+d.nombre.trim().toLowerCase()+d.apellido.trim().toLowerCase();if(vistos.has(k))return false;vistos.add(k);return true});
  l.sort((a,b)=>a.grado-b.grado||a.apellido.localeCompare(b.apellido));
  $('count').textContent=l.length+' entrega(s)';
  $('rows').innerHTML=l.map(d=>`<tr><td class="tf">${thumb(d)}</td><td><b>${esc(d.apellido)}, ${esc(d.nombre)}</b></td><td>${d.grado}°</td><td>${esc(d.rol)}</td><td>${new Date(d.created_at).toLocaleString('es-AR')}</td><td style="white-space:nowrap"><button class="btn" onclick="ver('${d.id}')">👁️ Ver</button> <button class="btn g" onclick="borrar('${d.id}')">🗑️</button></td></tr>`).join('')||'<tr><td colspan="6">Todavía no hay entregas.</td></tr>';
}
/* ===== Fotos: miniatura + zoom solo de la foto ===== */
function fotoDe(d){
  if(d._foto!==undefined) return d._foto;
  let f='';
  try{
    // DOMParser no ejecuta nada; solo aceptamos una imagen base64 de tipo conocido.
    const doc=new DOMParser().parseFromString('<div>'+(d.cv_html||'')+'</div>','text/html');
    const el=doc.querySelector('.cv-photo');
    const m=el&&/url\(["']?(data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+)["']?\)/.exec(el.getAttribute('style')||'');
    f=m?m[1]:'';
  }catch(e){}
  return d._foto=f;
}
function thumb(d){
  const f=fotoDe(d);
  return f?`<img class="thumb" src="${f}" alt="Foto de ${esc(d.nombre)}" title="Tocá para ampliar" tabindex="0" role="button" onclick="zoomFoto('${d.id}')" onkeydown="if(event.key==='Enter')zoomFoto('${d.id}')">`:'<div class="thumb" title="Sin foto"></div>';
}
let zNivel=1;
function zoomAplicar(){
  const lado=Math.min(innerWidth,innerHeight)*0.8*zNivel;
  $('zimg').style.width=lado+'px'; $('zimg').style.height=lado+'px'; $('zimg').style.objectFit='contain';
}
function zoomPaso(p){ zNivel=Math.min(5,Math.max(0.5,zNivel+p)); zoomAplicar(); }
function zoomFoto(id){
  const d=datos.find(x=>x.id===id)||njDatos.find(x=>x.id===id); if(!d||!fotoDe(d)) return;
  zNivel=1; $('zimg').src=fotoDe(d); $('zimg').alt='Foto de '+d.nombre;
  $('zname').textContent=d.nombre+' '+d.apellido+' · '+d.grado+'°';
  zoomAplicar(); $('zoom').classList.add('show'); $('zbox').scrollTo(0,0);
}
function cerrarZoom(){ $('zoom').classList.remove('show'); $('zimg').removeAttribute('src'); }
$('zbox').addEventListener('click',e=>{ if(e.target===$('zbox')) cerrarZoom(); });
$('zbox').addEventListener('wheel',e=>{ e.preventDefault(); zoomPaso(e.deltaY<0?0.25:-0.25); },{passive:false});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('zoom').classList.contains('show')) cerrarZoom(); else if($('modal').classList.contains('show')) cerrar(); } });
function ver(id){
  const d=datos.find(x=>x.id===id)||njDatos.find(x=>x.id===id);
  if(!d||!d.cv_html) return;
  // El álbum va en un iframe sin scripts: aunque un alumno mande HTML raro, no se ejecuta nada.
  $('frame').srcdoc=`<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="${new URL('cv.css',location.href).href}"><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:'Nunito',sans-serif}.cv{-webkit-print-color-adjust:exact;print-color-adjust:exact}.cv-body{display:grid;grid-template-columns:300px 1fr}@media print{.cv{border-radius:0}.cv-body{grid-template-columns:260px 1fr}}</style></head><body><div class="cv ${esc((d.theme||'').replace(/[^a-z-]/g,''))}">${d.cv_html}</div></body></html>`;
  $('modal').classList.add('show');
}
function cerrar(){ $('modal').classList.remove('show'); $('frame').srcdoc=''; }
function imprimir(){ $('frame').contentWindow.print(); }
async function borrar(id){
  if(!confirm('¿Borrar esta entrega? No se puede deshacer.')) return;
  try{ await rpc('admin_borrar',{p_clave:clave,p_id:id}); datos=datos.filter(d=>d.id!==id); pintar(); }catch(e){ alert(e.message); }
}
/* ===== ESTADÍSTICAS DEL AÑO (para planificar) ===== */
let stG='todos', ST=null;
function vista(v){
  $('ent').style.display=v==='ent'?'':'none'; $('st').style.display=v==='st'?'':'none'; $('nj').style.display=v==='nj'?'':'none';
  $('vEnt').className='btn '+(v==='ent'?'y':'g'); $('vSt').className='btn '+(v==='st'?'y':'g'); $('vNj').className='btn '+(v==='nj'?'y':'g');
  if(v==='st') stats();
  if(v==='nj') cargarNinja();
}

/* ===== DESAFÍO NINJA DIGITAL ===== */
let njDatos=[], njG='todos', njOrden=[];
async function cargarNinja(){
  $('njBody').innerHTML='<p class="muted">Cargando…</p>';
  try{ njDatos=await rpc('admin_listar_ninja',{p_clave:clave}); pintarNinja(); }
  catch(e){ $('njBody').innerHTML='<p class="muted">⚠️ '+esc(e.message)+'</p>'; }
}
function setNjG(g){ njG=g; pintarNinja(); }
function pintarNinja(){
  const v=new Set(), ult=[];
  for(const d of njDatos){ const k=d.nombre.trim().toLowerCase()+'|'+d.apellido.trim().toLowerCase(); if(v.has(k)) continue; v.add(k); ult.push(d); }
  const al=ult.sort((a,b)=>a.apellido.localeCompare(b.apellido)||a.nombre.localeCompare(b.nombre));
  njOrden=al;
  $('njGrados').innerHTML='<span style="flex:1"></span><button class="btn g" onclick="csvNinja()">📄 Bajar CSV</button><button class="btn g" onclick="window.print()">🖨️ Imprimir</button><button class="btn g" onclick="cargarNinja()">🔄 Actualizar</button>';
  if(!al.length){ $('njBody').innerHTML='<p class="muted">Todavía no hay resultados del desafío Ninja.</p>'; return; }
  const prom=Math.round(al.reduce((s,d)=>s+d.porcentaje,0)/al.length);
  const cint={}; al.forEach(d=>cint[d.cinturon]=(cint[d.cinturon]||0)+1);
  const pBloque=b=>{ const ps=NINJA_PREGUNTAS.filter(p=>p.b===b); return d=>{ const r=ps.filter(p=>p.id in (d.respuestas||{})); return r.length?Math.round(r.filter(p=>d.respuestas[p.id]===1).length*100/r.length):null; }; };
  // por pregunta
  const porP=NINJA_PREGUNTAS.map(p=>{ let n=0,ok=0; al.forEach(d=>{ if(p.id in (d.respuestas||{})){ n++; if(d.respuestas[p.id]===1) ok++; } }); return {...p,n,ok,pct:n?ok*100/n:null}; });
  const dificiles=porP.filter(p=>p.n>=2&&p.pct<60).sort((a,b)=>a.pct-b.pct).slice(0,12);
  const porB=NINJA_BLOQUES.map((B,i)=>{ const f=pBloque(i); const v=al.map(f).filter(x=>x!=null); return {B,n:v.length,pct:v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null}; });
  const celda=x=>x==null?'<span class="who">—</span>':x+'%';
  $('njBody').innerHTML=`
  <div class="sgrid">
    <div class="kpi"><b>${al.length}</b>alumnos que jugaron</div>
    <div class="kpi"><b>${prom}%</b>promedio de aciertos a la primera</div>
    <div class="kpi"><b>${dificiles.length}</b>preguntas para repasar</div>
  </div>
  <p class="hint2">Se cuenta la última entrega de cada alumno. “Acierto” = respondió bien a la primera. Cinturones: ${Object.entries(cint).map(([k,v])=>esc(k)+' ('+v+')').join(' · ')}.</p>

  <h3 class="sec">🎯 Por bloque</h3>
  <table><thead><tr><th>Bloque</th><th>Alumnos</th><th>Aciertos</th></tr></thead><tbody>${porB.map(x=>`<tr><td>${x.B.e} ${x.B.n}</td><td>${x.n}</td><td>${celda(x.pct)}${x.pct!=null?barra(x.pct/100,x.B.c):''}</td></tr>`).join('')}</tbody></table>

  <h3 class="sec">📌 Preguntas que más costaron (para repasar en clase)</h3>
  <div class="box"><ul>${dificiles.map(p=>`<li><span class="tag2 t-ref">${Math.round(p.pct)}%</span> <b>${esc(p.q)}</b> <span class="who">${NINJA_BLOQUES[p.b].e} ${esc(p.t)} · ${p.ok}/${p.n} acertaron</span><div class="who">Respuesta: ${esc(p.o[0])}</div></li>`).join('')||'<li class="muted">Ninguna por debajo del 60% (con al menos 2 respuestas).</li>'}</ul></div>

  <h3 class="sec">👥 Alumnos</h3>
  <table><thead><tr><th></th><th>Alumno</th><th>Cinturón</th><th>Total</th>${NINJA_BLOQUES.map(B=>`<th title="${esc(B.n)}">${B.e}</th>`).join('')}<th>Enviado</th><th></th></tr></thead><tbody>${al.map(d=>`<tr><td class="tf">${thumb(d)}</td><td><b>${esc(d.apellido)}, ${esc(d.nombre)}</b></td><td>${esc(d.cinturon)}</td><td><b>${d.porcentaje}%</b></td>${NINJA_BLOQUES.map((B,i)=>`<td>${celda(pBloque(i)(d))}</td>`).join('')}<td class="who">${new Date(d.created_at).toLocaleString('es-AR')}</td><td style="white-space:nowrap">${d.cv_html?`<button class="btn" onclick="ver('${d.id}')">👁️ Ver CV</button> `:'<span class="who">sin CV </span>'}<button class="btn g" onclick="borrarNinja('${d.id}')" aria-label="Borrar">🗑️</button></td></tr>`).join('')}</tbody></table>
  <p class="hint2">Columnas por bloque: ${NINJA_BLOQUES.map(B=>B.e+' '+B.n).join(' · ')}.</p>`;
}
async function borrarNinja(id){
  if(!confirm('¿Borrar este resultado? No se puede deshacer.')) return;
  try{ await rpc('admin_borrar_ninja',{p_clave:clave,p_id:id}); njDatos=njDatos.filter(d=>d.id!==id); pintarNinja(); }catch(e){ alert(e.message); }
}
function csvNinja(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const f=[['Apellido','Nombre','Cinturon','% total',...NINJA_BLOQUES.map(B=>'% '+B.n),'Enviado'].map(q).join(',')];
  njOrden.forEach(d=>f.push([q(d.apellido),q(d.nombre),q(d.cinturon),d.porcentaje,...NINJA_BLOQUES.map((B,i)=>{const ps=NINJA_PREGUNTAS.filter(p=>p.b===i).filter(p=>p.id in (d.respuestas||{}));return ps.length?Math.round(ps.filter(p=>d.respuestas[p.id]===1).length*100/ps.length):'';}),q(d.created_at)].join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+f.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='ninja-digital-2026.csv'; a.click();
}
function setG(g){ stG=g; stats(); }
function ultimas(){
  const v=new Set(), out=[];
  for(const d of datos){ const k=d.grado+'|'+d.nombre.trim().toLowerCase()+'|'+d.apellido.trim().toLowerCase(); if(v.has(k)) continue; v.add(k); out.push(d); }
  return out;
}
function temasDe(g){ return [...COMUN,...(EXTRA[g]||[])]; }
function calc(alumnos){
  const porTema=new Map(), areas={};
  Object.keys(AREAS).forEach(k=>areas[k]={k,tot:0,marc:0,suma:0,cont:0});
  let marcadosTotal=0; const fav={}, costo=[], futuro=[], hob={};
  for(const d of alumnos){
    const g=String(d.grado), D=d.data||{}, sel=D.sel||{};
    for(const t of temasDe(g)){
      let r=porTema.get(t.n);
      if(!r){ r={n:t.n,em:t.em,a:t.a,al:0,mar:0,est:[0,0,0,0]}; porTema.set(t.n,r); }
      r.al++; areas[t.a].tot++;
      const id=g+'-'+t.n;
      if(id in sel){ const s=Math.min(3,+sel[id]||0); r.mar++; areas[t.a].marc++; r.est[s]++; marcadosTotal++; if(s>0){ areas[t.a].suma+=s; areas[t.a].cont++; } }
    }
    const nom=d.nombre.trim()+' '+d.apellido.trim()+' ('+g+'°)';
    if(D.favorito){ const n=String(D.favorito).replace(/^\d-/,''); (fav[n]=fav[n]||[]).push({nom,txt:D.favPorque||''}); }
    if((D.costo||'').trim()) costo.push({nom,txt:D.costo.trim()});
    if((D.futuro||'').trim()) futuro.push({nom,txt:D.futuro.trim()});
    (D.hobbies||[]).forEach(h=>hob[h]=(hob[h]||0)+1);
  }
  const temas=[...porTema.values()].map(r=>{
    const n=r.est[1]+r.est[2]+r.est[3];
    return {...r,pct:r.al?r.mar/r.al:0,avg:n?(r.est[1]+2*r.est[2]+3*r.est[3])/n:null};
  });
  return {alumnos:alumnos.length,promTemas:marcadosTotal/alumnos.length,areas,temas,fav,costo,futuro,hob};
}
function estr(v){ return v==null?'—':v.toFixed(1)+' ★'; }
function barra(p,c){ return `<div class="tbar"><div style="width:${Math.round(p*100)}%;background:${c}"></div></div>`; }
function stats(){
  const gs=['5','6','7'];
  $('stGrados').innerHTML=['todos',...gs].map(g=>`<button class="btn ${g===stG?'y':'g'}" onclick="setG('${g}')">${g==='todos'?'Todos los grados':g+'° grado'}</button>`).join('')+'<span style="flex:1"></span><button class="btn g" onclick="csvStats()">📄 Bajar CSV</button><button class="btn g" onclick="window.print()">🖨️ Imprimir</button>';
  const al=ultimas().filter(d=>stG==='todos'||String(d.grado)===stG);
  if(!al.length){ ST=null; $('stBody').innerHTML='<p class="muted">Todavía no hay entregas en este grado.</p>'; return; }
  ST=calc(al); pintarStats();
}
function pintarStats(){
  const S=ST, titulo=stG==='todos'?'todos los grados':stG+'° grado';
  const emo=n=>{const t=S.temas.find(x=>x.n===n);return t?t.em:'';};
  const conAvg=S.temas.filter(t=>t.avg!=null);
  const reforzar=conAvg.filter(t=>t.avg<1.8&&t.mar>=2).sort((a,b)=>a.avg-b.avg);
  const fuertes=conAvg.filter(t=>t.avg>=2.5&&t.pct>=0.5).sort((a,b)=>b.avg-a.avg);
  const pocos=S.temas.filter(t=>t.pct<0.4).sort((a,b)=>a.pct-b.pct);
  const li=(t,extra)=>`<li>${t.em} <b>${esc(t.n)}</b> <span class="who">${extra}</span></li>`;
  const orden=($('stOrden')||{}).value||'area';
  const ord={area:(a,b)=>a.a.localeCompare(b.a)||a.n.localeCompare(b.n),menos:(a,b)=>a.pct-b.pct,mas:(a,b)=>b.pct-a.pct,bajo:(a,b)=>(a.avg??9)-(b.avg??9),alto:(a,b)=>(b.avg??-1)-(a.avg??-1)}[orden];
  const favs=Object.entries(S.fav).sort((a,b)=>b[1].length-a[1].length);
  const hobs=Object.entries(S.hob).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const filas=[...S.temas].sort(ord).map(t=>{
    const c=AREAS[t.a];
    return `<tr><td>${t.em} ${esc(t.n)}<div class="who">${c.e} ${c.n}</div></td><td>${t.mar}/${t.al} (${Math.round(t.pct*100)}%)${barra(t.pct,c.hex)}</td><td>${estr(t.avg)}${t.avg!=null?barra(t.avg/3,c.hex):''}</td><td class="who">${t.est[1]} · ${t.est[2]} · ${t.est[3]}</td></tr>`;
  }).join('');
  $('stBody').innerHTML=`
  <div class="sgrid">
    <div class="kpi"><b>${S.alumnos}</b>alumnos con álbum (${titulo})</div>
    <div class="kpi"><b>${S.promTemas.toFixed(1)}</b>temas marcados por alumno</div>
    <div class="kpi"><b>${reforzar.length}</b>temas para reforzar</div>
    <div class="kpi"><b>${pocos.length}</b>temas poco recordados</div>
  </div>
  <p class="hint2">Se cuenta la última entrega de cada alumno. “Nivel” es el promedio de estrellas (1 = lo vi, 2 = lo sé hacer, 3 = lo podría enseñar) entre quienes marcaron el tema.</p>

  <h3 class="sec">📌 Para planificar</h3>
  <div class="cols2">
    <div class="box"><h4><span class="tag2 t-ref">Reforzar</span> nivel bajo (menos de 1,8 ★)</h4><ul>${reforzar.map(t=>li(t,estr(t.avg)+' · '+t.mar+' alumnos')).join('')||'<li class="muted">Ninguno por ahora.</li>'}</ul></div>
    <div class="box"><h4><span class="tag2 t-poc">Revisar</span> lo marcó menos del 40%</h4><ul>${pocos.map(t=>li(t,Math.round(t.pct*100)+'% lo marcó')).join('')||'<li class="muted">Ninguno por ahora.</li>'}</ul></div>
    <div class="box"><h4><span class="tag2 t-ok">Consolidado</span> nivel alto (2,5 ★ o más)</h4><ul>${fuertes.map(t=>li(t,estr(t.avg)+' · '+Math.round(t.pct*100)+'% lo marcó')).join('')||'<li class="muted">Ninguno por ahora.</li>'}</ul></div>
  </div>

  <h3 class="sec">🧭 Por área</h3>
  <table><thead><tr><th>Área</th><th>Temas marcados</th><th>Nivel promedio</th></tr></thead><tbody>${Object.entries(AREAS).map(([k,a])=>{const A=S.areas[k];const p=A.tot?A.marc/A.tot:0;const av=A.cont?A.suma/A.cont:null;return `<tr><td>${a.e} ${a.n}</td><td>${Math.round(p*100)}%${barra(p,a.hex)}</td><td>${estr(av)}${av!=null?barra(av/3,a.hex):''}</td></tr>`}).join('')}</tbody></table>

  <h3 class="sec">📚 Todos los temas</h3>
  <div class="row"><label class="muted">Ordenar por </label><select id="stOrden" onchange="pintarStats()">
    <option value="area">Área</option><option value="menos">Menos marcados primero</option><option value="mas">Más marcados primero</option><option value="bajo">Menor nivel primero</option><option value="alto">Mayor nivel primero</option></select></div>
  <table><thead><tr><th>Tema</th><th>Lo marcaron</th><th>Nivel</th><th title="Cantidad de alumnos con 1 · 2 · 3 estrellas">1★ · 2★ · 3★</th></tr></thead><tbody>${filas}</tbody></table>

  <h3 class="sec">🌟 Clases favoritas</h3>
  <div class="cols2">${favs.map(([n,l])=>`<div class="box"><h4>${emo(n)} ${esc(n)} · ${l.length}</h4><ul>${l.filter(x=>x.txt.trim()).map(x=>`<li>“${esc(x.txt)}” <span class="who">— ${esc(x.nom)}</span></li>`).join('')||'<li class="muted">Sin comentarios.</li>'}</ul></div>`).join('')||'<p class="muted">Sin datos.</p>'}</div>

  <h3 class="sec">🧗 Lo que les costó y cómo lo resolvieron</h3>
  <div class="box"><ul>${S.costo.map(x=>`<li>“${esc(x.txt)}” <span class="who">— ${esc(x.nom)}</span></li>`).join('')||'<li class="muted">Sin respuestas.</li>'}</ul></div>

  <h3 class="sec">🔮 Qué quieren aprender el año que viene</h3>
  <div class="box"><ul>${S.futuro.map(x=>`<li>“${esc(x.txt)}” <span class="who">— ${esc(x.nom)}</span></li>`).join('')||'<li class="muted">Sin respuestas.</li>'}</ul></div>

  <h3 class="sec">❤️ Intereses más elegidos</h3>
  <div class="box"><ul>${hobs.map(([h,n])=>`<li>${esc(h)} <span class="who">· ${n}</span></li>`).join('')||'<li class="muted">Sin datos.</li>'}</ul></div>`;
  const sel=$('stOrden'); if(sel) sel.value=orden;
}
function csvStats(){
  if(!ST) return;
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const filas=[['Tema','Area','Alumnos','Lo marcaron','% que lo marco','Nivel promedio (1-3)','1 estrella','2 estrellas','3 estrellas'].map(q).join(',')];
  ST.temas.forEach(t=>filas.push([q(t.n),q(AREAS[t.a].n),t.al,t.mar,Math.round(t.pct*100),t.avg==null?'':t.avg.toFixed(2),t.est[1],t.est[2],t.est[3]].join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+filas.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='estadistica-'+stG+'-2026.csv'; a.click();
}
function bajar(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(datos.map(({cv_html,_foto,...r})=>r),null,1)],{type:'application/json'}));
  a.download='entregas-cv-tech-2026.json'; a.click();
}
</script>
</body>
</html>
